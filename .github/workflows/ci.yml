name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config & rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v2.53.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager" \
            --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /k8s

  build-and-scan:
    runs-on: ubuntu-latest
    needs: [test, validate-configs]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t payments-api:${{ github.sha }} .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: payments-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8000:8000 payments-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/health/ready && break; sleep 1; done
          curl -fs -X POST localhost:8000/api/payments -H 'Content-Type: application/json' \
            -d '{"amount":10,"currency":"USD","from_account":"ACC-1","to_account":"ACC-2"}'
